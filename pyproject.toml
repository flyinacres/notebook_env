[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "steady-nb"
version = "0.1.0"
description = "Analyzes Jupyter notebooks and generates reproducible environment setup cells for Kaggle, Colab, and local Python."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
steady-nb = "steady_nb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]